<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Клуб подій</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>Клуб подій</h1>
      <p>Керуйте заявками на участь у шкільних активностях</p>
    </header>

    <main class="layout">
      <section class="panel form-panel">
        <h2>Нова заявка</h2>
        <form id="requestForm" novalidate>
          <label for="nameInput">Ім'я учасника</label>
          <input type="text" id="nameInput" placeholder="Марія Коваль" autocomplete="off">

          <label for="eventInput">Назва події</label>
          <input type="text" id="eventInput" placeholder="Хакатон ліцею" autocomplete="off">

          <p id="errorMessage" class="error" role="alert"></p>

          <button type="submit" class="btn-primary">+ Додати заявку</button>
        </form>
      </section>

      <section class="panel list-panel">
        <h2>Учасники</h2>

        <div class="stats">
          <div class="stat">
            <span class="stat-label">Усього заявок</span>
            <strong id="totalCount">0</strong>
          </div>
          <div class="stat">
            <span class="stat-label">Підтверджено</span>
            <strong id="confirmedCount">0</strong>
          </div>
        </div>

        <p id="emptyMessage" class="empty">Заявок поки немає</p>
        <div id="requestList" class="request-list"></div>

        <button type="button" id="clearAllBtn" class="btn-link">Очистити всі заявки</button>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
